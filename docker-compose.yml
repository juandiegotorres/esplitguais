# Producción: la app no publica puertos (Docker los abriría saltándose ufw).
# Solo la alcanza cloudflared por la red interna de Compose (http://app:8000).
services:
  app:
    build: .
    image: esplitiguais:latest
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on: [app]
